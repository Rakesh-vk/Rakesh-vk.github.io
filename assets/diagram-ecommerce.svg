<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6e6e73"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0071e3"/>
    </marker>
  </defs>

  <style>
    .box { fill:#ffffff; stroke:#d2d2d7; stroke-width:1.2; }
    .box-accent { fill:#f5f5f7; stroke:#0071e3; stroke-width:1.4; }
    .pill { fill:#f5f5f7; stroke:#c7c7cc; stroke-width:1; }
    .infra { fill:#1d1d1f; }
    .label { fill:#1d1d1f; font-size:15px; font-weight:600; }
    .label-white { fill:#ffffff; font-size:14px; font-weight:600; }
    .sub { fill:#6e6e73; font-size:11px; }
    .sub-white { fill:#c7c7cc; font-size:10.5px; }
    .pill-text { fill:#1d1d1f; font-size:12px; font-weight:600; }
    .edge { stroke:#6e6e73; stroke-width:1.3; fill:none; }
    .edge-async { stroke:#0071e3; stroke-width:1.5; fill:none; stroke-dasharray:5 4; }
    .edge-label { fill:#6e6e73; font-size:10.5px; }
    .edge-label-blue { fill:#0071e3; font-size:10.5px; }
    .note { fill:#86868b; font-size:11.5px; }
  </style>

  <!-- Client -->
  <rect x="500" y="24" width="200" height="52" rx="12" class="box"/>
  <text x="600" y="46" text-anchor="middle" class="label">Client</text>
  <text x="600" y="64" text-anchor="middle" class="sub">Swagger · Postman</text>
  <line x1="600" y1="76" x2="600" y2="128" class="edge" marker-end="url(#arrow)"/>

  <!-- Gateway -->
  <rect x="470" y="128" width="260" height="58" rx="12" class="box-accent"/>
  <text x="600" y="152" text-anchor="middle" class="label">API Gateway</text>
  <text x="600" y="171" text-anchor="middle" class="sub">Spring Cloud Gateway · :8080</text>

  <!-- Discovery -->
  <line x1="730" y1="157" x2="958" y2="157" class="edge" stroke-dasharray="2 4" marker-end="url(#arrow)"/>
  <rect x="960" y="128" width="190" height="58" rx="12" class="box"/>
  <text x="1055" y="152" text-anchor="middle" class="label">Discovery</text>
  <text x="1055" y="171" text-anchor="middle" class="sub">Eureka registry · :8761</text>

  <!-- fan out to 4 services -->
  <line x1="560" y1="186" x2="150" y2="248" class="edge" marker-end="url(#arrow)"/>
  <line x1="590" y1="186" x2="420" y2="248" class="edge" marker-end="url(#arrow)"/>
  <line x1="610" y1="186" x2="690" y2="248" class="edge" marker-end="url(#arrow)"/>
  <line x1="640" y1="186" x2="975" y2="248" class="edge" marker-end="url(#arrow)"/>

  <!-- Row: 4 core services -->
  <rect x="40" y="248" width="220" height="58" rx="12" class="box"/>
  <text x="150" y="272" text-anchor="middle" class="label">User Service</text>
  <text x="150" y="291" text-anchor="middle" class="sub">auth · JWT · :8081</text>

  <rect x="310" y="248" width="220" height="58" rx="12" class="box"/>
  <text x="420" y="272" text-anchor="middle" class="label">Product Service</text>
  <text x="420" y="291" text-anchor="middle" class="sub">catalog · stock · :8082</text>

  <rect x="580" y="248" width="220" height="58" rx="12" class="box"/>
  <text x="690" y="272" text-anchor="middle" class="label">Order Service</text>
  <text x="690" y="291" text-anchor="middle" class="sub">orders · :8083</text>

  <rect x="855" y="248" width="220" height="58" rx="12" class="box"/>
  <text x="965" y="272" text-anchor="middle" class="label">Checkout Service</text>
  <text x="965" y="291" text-anchor="middle" class="sub">orchestrates order</text>

  <!-- Checkout -> Order -->
  <line x1="855" y1="288" x2="802" y2="288" class="edge" marker-end="url(#arrow)"/>
  <text x="828" y="280" text-anchor="middle" class="edge-label">REST</text>

  <!-- User -> userdb, Product -> productdb -->
  <line x1="150" y1="306" x2="150" y2="380" class="edge" marker-end="url(#arrow)"/>
  <rect x="70" y="380" width="160" height="42" rx="10" class="pill"/>
  <text x="150" y="406" text-anchor="middle" class="pill-text">userdb</text>

  <line x1="420" y1="306" x2="420" y2="380" class="edge" marker-end="url(#arrow)"/>
  <rect x="340" y="380" width="160" height="42" rx="10" class="pill"/>
  <text x="420" y="406" text-anchor="middle" class="pill-text">productdb</text>

  <!-- Order -> Payment -->
  <line x1="690" y1="306" x2="690" y2="380" class="edge" marker-end="url(#arrow)"/>
  <text x="708" y="345" class="edge-label">REST</text>
  <rect x="580" y="380" width="220" height="56" rx="12" class="box"/>
  <text x="690" y="404" text-anchor="middle" class="label">Payment Service</text>
  <text x="690" y="423" text-anchor="middle" class="sub">payments · :8084</text>

  <line x1="690" y1="436" x2="690" y2="480" class="edge" marker-end="url(#arrow)"/>
  <rect x="610" y="480" width="160" height="42" rx="10" class="pill"/>
  <text x="690" y="506" text-anchor="middle" class="pill-text">paymentdb</text>

  <!-- Order -> Kafka (async) -->
  <path d="M 720,306 C 800,360 900,400 950,460" class="edge-async" marker-end="url(#arrowBlue)"/>
  <text x="835" y="378" text-anchor="middle" class="edge-label-blue">OrderCreatedEvent</text>

  <rect x="850" y="460" width="200" height="56" rx="12" class="infra"/>
  <text x="950" y="484" text-anchor="middle" class="label-white">Apache Kafka</text>
  <text x="950" y="502" text-anchor="middle" class="sub-white">topic · order.created</text>

  <line x1="950" y1="516" x2="950" y2="560" class="edge-async" marker-end="url(#arrowBlue)"/>

  <rect x="840" y="560" width="220" height="58" rx="12" class="box-accent"/>
  <text x="950" y="584" text-anchor="middle" class="label">Notification Service</text>
  <text x="950" y="603" text-anchor="middle" class="sub">Kafka consumer · :8085</text>

  <line x1="905" y1="618" x2="855" y2="662" class="edge" marker-end="url(#arrow)"/>
  <line x1="995" y1="618" x2="1045" y2="662" class="edge" marker-end="url(#arrow)"/>

  <rect x="760" y="662" width="190" height="42" rx="10" class="pill"/>
  <text x="855" y="688" text-anchor="middle" class="pill-text">notification_db</text>

  <rect x="950" y="662" width="190" height="42" rx="10" class="pill"/>
  <text x="1045" y="682" text-anchor="middle" class="pill-text">Mailpit</text>
  <text x="1045" y="696" text-anchor="middle" class="sub" font-size="9.5">SMTP :1025 · UI :8025</text>

  <!-- note -->
  <text x="40" y="748" class="note">Each service owns its database (database-per-service). All services register with Eureka on startup.</text>

  <!-- legend -->
  <line x1="40" y1="774" x2="80" y2="774" class="edge"/>
  <text x="88" y="778" class="sub">synchronous · REST</text>
  <line x1="240" y1="774" x2="280" y2="774" class="edge-async"/>
  <text x="288" y="778" class="sub">asynchronous · Kafka</text>
</svg>
